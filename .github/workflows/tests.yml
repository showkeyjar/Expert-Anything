name: Tests

on:
  push:
    branches: [main, master, dev]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt (PySide6) needs a few system libraries even for the offscreen
      # platform plugin used by the UI tests.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libx11-6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run quick test suite
        run: python run_tests.py --quick

      - name: Release quality gate
        # Aggregates the offline scene + learning benchmarks into a single
        # pass/fail gate (decoder quality must not regress below the fallback,
        # and the teaching loop must demonstrably teach). Exits non-zero on any
        # failed check so a broken decoder or pedagogy regression blocks the PR.
        run: python -m expert_anything.core.quality_gate
